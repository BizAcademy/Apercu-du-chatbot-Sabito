kind = "web"
previewPath = "/"
title = "Sabito — Administration & Chat"
description = "Dashboard des plateformes Sabito : identifiants, connaissances approuvées et chat avec le protocole d’origine."
version = "1.0.0"
id = "artifacts/sabito-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22386

[services.development]
run = "pnpm --filter @workspace/sabito-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sabito-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/sabito-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22386"
BASE_PATH = "/"
