openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/admin/projects/{projectId}/assistant-settings:
    get:
      operationId: getAssistantConfiguration
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Classical retrieval, authored messages and configured backend intentions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistantSettingsResult"}
    put:
      operationId: updateAssistantConfiguration
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssistantSettingsUpdate"}
      responses:
        "200":
          description: Configuration saved and tenant index invalidated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssistantSettingsResult"}
        "409":
          description: Revision changed; reload before saving
  /v1/admin/projects/{projectId}/widget:
    get:
      operationId: getWidgetSettings
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Authorized website origins
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WidgetSettings"}
    put:
      operationId: updateWidgetSettings
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WidgetSettings"}
      responses:
        "200":
          description: Saved widget settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WidgetSettings"}
  /v1/widget/{projectId}/session:
    post:
      operationId: createWidgetVisitorSession
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WidgetVisitorInput"}
      responses:
        "200":
          description: Anonymous visitor session, never a verified platform member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WidgetVisitorSession"}
  /v1/status:
    get:
      operationId: getSabitoCoreStatus
      responses:
        "200":
          description: Configuration state without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreStatus"
  /v1/admin/projects:
    get:
      operationId: listSabitoProjects
      responses:
        "200":
          description: Authorized platforms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createSabitoProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInput"
      responses:
        "201":
          description: Project and one-time credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreated"
  /v1/admin/projects/{projectId}/credentials/rotate:
    post:
      operationId: rotateSabitoCredentials
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: One-time replacement credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResult"
  /v1/admin/projects/{projectId}/knowledge:
    get:
      operationId: listPlatformKnowledge
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Approved documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
    post:
      operationId: addPlatformKnowledge
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Approved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResult"
  /v1/admin/projects/{projectId}/knowledge/{documentId}:
    put:
      operationId: updatePlatformKnowledge
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: documentId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: Updated approved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResult"
    delete:
      operationId: removePlatformKnowledge
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: Document removed
  /v1/admin/projects/{projectId}/test-token:
    post:
      operationId: createPlatformTestToken
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Admin-authorized test token for the original Socket.IO engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformToken"
  /v1/auth/token:
    post:
      operationId: authenticateSabitoPlatform
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformIdentity"
      responses:
        "200":
          description: Short-lived token (Basic client credentials required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformToken"
  /v1/conversations/{conversationId}/messages:
    get:
      operationId: getPlatformMessages
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Messages scoped to the authenticated platform and user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
  /sabito/chat:
    post:
      operationId: askSabito
      summary: Test Sabito against this browser's approved BCA knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SabitoChatInput"
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SabitoReply"
        "400":
          description: Invalid conversation
        "403":
          description: Preview only
        "429":
          description: Rate limit reached
        "503":
          description: AI unavailable
  /sabito/knowledge:
    get:
      operationId: listSabitoKnowledge
      responses:
        "200":
          description: Approved corrections for this preview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeEntry"
    post:
      operationId: saveSabitoKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeInput"
      responses:
        "200":
          description: Saved correction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Invalid correction
        "409":
          description: Knowledge limit reached
  /sabito/knowledge/{id}:
    delete:
      operationId: deleteSabitoKnowledge
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted correction
        "404":
          description: Correction not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/admin/projects/{projectId}/unanswered:
    get:
      operationId: listUnansweredQuestions
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [a_traiter, traite, all]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Questions sans réponse triées par fréquence, 50 par page
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/UnansweredQuestion"}}
                  total: {type: integer}
                  page: {type: integer}
  /v1/admin/projects/{projectId}/unanswered/{questionId}/answer:
    post:
      operationId: answerUnansweredQuestion
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: questionId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 20, maxLength: 20000}
      responses:
        "201":
          description: Référence créée et question traitée atomiquement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentResult"}
        "409":
          description: Question introuvable ou déjà traitée
  /v1/admin/projects/{projectId}/backend-status:
    get:
      operationId: getBackendConnectionStatus
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Présence récente du backend serveur, pas un accès navigateur
          content:
            application/json:
              schema:
                type: object
                required: [connected, last_seen]
                properties:
                  connected: {type: boolean}
                  last_seen: {type: string, nullable: true}
  /v1/admin/projects/{projectId}/tickets:
    get:
      operationId: listSupportTickets
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ouvert, ferme, all]}}
        - {name: page, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Tickets de vérification
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/SupportTicket"}}
                  total: {type: integer}
                  page: {type: integer}
  /v1/admin/projects/{projectId}/tickets/{ticketId}:
    patch:
      operationId: updateSupportTicket
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: ticketId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TicketStatusInput"}
      responses:
        "200":
          description: Ticket actualisé
  /v1/admin/projects/{projectId}/tickets/{ticketId}/messages:
    get:
      operationId: getSupportTicketMessages
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {name: ticketId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Conversation du ticket, uniquement pour l’administrateur de la plateforme
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageList"}
  /v1/backend/jobs/poll:
    post:
      operationId: pollBackendJobs
      description: Serveur uniquement. HTTP Basic avec les clés client générées par Sabito. Refuse tout en-tête Origin.
      responses:
        "200":
          description: Vérifications destinées uniquement à la plateforme authentifiée
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: "#/components/schemas/BackendJob"}}
  /v1/backend/jobs/{jobId}/result:
    post:
      operationId: submitBackendJobResult
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BackendResultSubmission"}
      responses:
        "200":
          description: Résultat accepté une fois pour cette plateforme et ce job non expiré
        "404":
          description: Job expiré, déjà consommé ou appartenant à une autre plateforme
components:
  schemas:
    ChatSuggestion:
      type: object
      required: [document_id, question]
      properties:
        document_id: {type: string}
        question: {type: string}
    IntentField:
      type: object
      required: [name, prompt, type, min_length, max_length]
      properties:
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
        prompt: {type: string, minLength: 1, maxLength: 4000}
        type: {type: string, enum: [text, identifier, country]}
        min_length: {type: integer, minimum: 1, maximum: 500}
        max_length: {type: integer, minimum: 1, maximum: 500}
    IntentResponses:
      type: object
      required: [success, pending, not_found, error]
      properties:
        success: {type: string, minLength: 1, maxLength: 4000}
        pending: {type: string, minLength: 1, maxLength: 4000}
        not_found: {type: string, minLength: 1, maxLength: 4000}
        error: {type: string, minLength: 1, maxLength: 4000}
    IntentDefinition:
      type: object
      required: [id, name, enabled, triggers, fields, backend_function, guest_message, responses]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
        name: {type: string, minLength: 2, maxLength: 100}
        enabled: {type: boolean}
        triggers:
          type: array
          minItems: 1
          maxItems: 30
          items: {type: string, minLength: 2, maxLength: 500}
        initial_response:
          type: string
          maxLength: 4000
          description: Réponse approuvée de secours si aucune référence ne répond exactement à la question, avant confirmation.
        confirmation_question:
          type: string
          minLength: 1
          maxLength: 4000
          description: Question oui/non posée après la réponse, avant toute collecte ou vérification.
        fields:
          type: array
          maxItems: 15
          items: {$ref: "#/components/schemas/IntentField"}
        backend_function: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
        guest_message: {type: string, minLength: 1, maxLength: 4000}
        responses: {$ref: "#/components/schemas/IntentResponses"}
    AssistantSettings:
      type: object
      required: [confidence_threshold, synonyms, greeting_member, greeting_guest, greeting_member_no_name, closing_message, no_answer_message, suggestions_label, privacy_message, invalid_field_message, cancelled_message, checking_message, ticket_message, intents]
      properties:
        confidence_threshold: {type: number, minimum: 0.35, maximum: 1}
        synonyms:
          type: array
          maxItems: 100
          items:
            type: array
            minItems: 2
            maxItems: 20
            items: {type: string, minLength: 2, maxLength: 80}
        greeting_member: {type: string, minLength: 1, maxLength: 4000}
        greeting_guest: {type: string, minLength: 1, maxLength: 4000}
        greeting_member_no_name: {type: string, minLength: 1, maxLength: 4000}
        closing_message: {type: string, maxLength: 4000}
        no_answer_message: {type: string, minLength: 1, maxLength: 4000}
        suggestions_label: {type: string, minLength: 1, maxLength: 4000}
        privacy_message: {type: string, minLength: 1, maxLength: 4000}
        invalid_field_message: {type: string, minLength: 1, maxLength: 4000}
        cancelled_message: {type: string, minLength: 1, maxLength: 4000}
        checking_message: {type: string, minLength: 1, maxLength: 4000}
        ticket_message: {type: string, minLength: 1, maxLength: 4000}
        intents:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/IntentDefinition"}
    AssistantSettingsResult:
      type: object
      required: [settings, revision]
      properties:
        settings: {$ref: "#/components/schemas/AssistantSettings"}
        revision: {type: integer}
    AssistantSettingsUpdate:
      type: object
      required: [settings, expected_revision]
      properties:
        settings: {$ref: "#/components/schemas/AssistantSettings"}
        expected_revision: {type: integer, minimum: 0}
    BackendJob:
      type: object
      required: [id, operation, external_user_id, fields, expires_at]
      properties:
        id: {type: string}
        operation: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
        external_user_id: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        expires_at: {type: string}
    BackendResultSubmission:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [ok, success, pending, confirmed, failed, not_found, active, inactive, forbidden, error]}
            code: {type: string, minLength: 1, maxLength: 100}
            data:
              type: object
              maxProperties: 32
              additionalProperties:
                nullable: true
                oneOf:
                  - {type: string, maxLength: 2000}
                  - {type: number}
                  - {type: boolean}
    TicketStatusInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ouvert, ferme]}
    SupportTicket:
      type: object
      required: [id, project_id, conversation_id, intent, reason, status, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        conversation_id: {type: string}
        external_user_id: {type: string, nullable: true}
        intent: {type: string}
        reason: {type: string}
        status: {type: string, enum: [ouvert, ferme]}
        created_at: {type: string}
        updated_at: {type: string}
    UnansweredQuestion:
      type: object
      required: [id, question, plateforme, statut, nombre_de_fois_posee, date_creation, derniere_date]
      properties:
        id: {type: string}
        question: {type: string}
        plateforme: {type: string}
        utilisateur_id: {type: string, nullable: true}
        statut: {type: string, enum: [a_traiter, traite]}
        nombre_de_fois_posee: {type: integer}
        date_creation: {type: string}
        derniere_date: {type: string}
        document_id: {type: string, nullable: true}
    WidgetSettings:
      type: object
      required: [origins]
      properties:
        origins: {type: array, maxItems: 10, items: {type: string}}
    WidgetVisitorInput:
      type: object
      properties:
        visitor_token: {type: string, maxLength: 16384}
    WidgetVisitorSession:
      type: object
      required: [access_token, expires_in, external_user_id, socket_path, identity_type]
      properties:
        access_token: {type: string}
        expires_in: {type: integer}
        external_user_id: {type: string}
        socket_path: {type: string}
        identity_type: {type: string, enum: [guest]}
    CoreStatus:
      type: object
      required: [configured, missingSecrets, engine]
      properties:
        configured: {type: boolean}
        missingSecrets: {type: array, items: {type: string}}
        engine: {type: string}
    Platform:
      type: object
      required: [id, slug, name, assistantName, status]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        assistantName: {type: string}
        status: {type: string, enum: [active, disabled]}
        createdAt: {type: string}
    PlatformInput:
      type: object
      required: [slug, name, assistant_name, system_prompt]
      properties:
        slug: {type: string, minLength: 2, maxLength: 80}
        name: {type: string, minLength: 2, maxLength: 150}
        assistant_name: {type: string, minLength: 2, maxLength: 80}
        system_prompt: {type: string, minLength: 20, maxLength: 20000}
    ProjectList:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data: {type: array, items: {$ref: "#/components/schemas/Platform"}}
    PlatformCredentials:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId: {type: string}
        clientSecret: {type: string}
    CredentialResult:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data: {$ref: "#/components/schemas/PlatformCredentials"}
    ProjectCreated:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [project, credentials]
          properties:
            project: {$ref: "#/components/schemas/Platform"}
            credentials: {$ref: "#/components/schemas/PlatformCredentials"}
    KnowledgeFollowUp:
      type: object
      required: [question, answer]
      properties:
        question: {type: string, minLength: 2, maxLength: 500}
        answer: {type: string, minLength: 1, maxLength: 20000}
    DocumentInput:
      type: object
      required: [title, content]
      properties:
        title: {type: string, minLength: 2, maxLength: 255}
        content: {type: string, minLength: 20, maxLength: 1000000}
        follow_up_questions:
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/KnowledgeFollowUp"}
        variantes_de_question:
          type: array
          maxItems: 30
          items: {type: string, minLength: 2, maxLength: 500}
    PlatformDocument:
      type: object
      required: [id, title, content]
      properties:
        id: {type: string}
        title: {type: string}
        content: {type: string}
        follow_up_questions:
          type: array
          items: {$ref: "#/components/schemas/KnowledgeFollowUp"}
        variantes_de_question:
          type: array
          items: {type: string}
    DocumentList:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data: {type: array, items: {$ref: "#/components/schemas/PlatformDocument"}}
    DocumentResult:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [documentId, chunks]
          properties:
            documentId: {type: string}
            chunks: {type: integer}
    PlatformIdentity:
      type: object
      properties:
        external_user_id: {type: string, minLength: 1, maxLength: 191}
    PlatformToken:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [access_token, token_type, expires_in, socket_url, socket_path, external_user_id, identity_type]
          properties:
            access_token: {type: string}
            token_type: {type: string}
            expires_in: {type: integer}
            socket_url: {type: string}
            socket_path: {type: string}
            external_user_id: {type: string}
            identity_type: {type: string}
    PlatformMessage:
      type: object
      required: [id, role, content, status]
      properties:
        id: {type: string}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        status: {type: string}
        suggestions: {type: array, items: {$ref: "#/components/schemas/ChatSuggestion"}}
        suggestions_label: {type: string}
        closing_message: {type: string}
    MessageList:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data: {type: array, items: {$ref: "#/components/schemas/PlatformMessage"}}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SabitoTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    SabitoChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/SabitoTurn"
    SabitoReply:
      type: object
      required: [answer, source]
      properties:
        answer:
          type: string
        source:
          type: string
          enum: [ai, correction]
    KnowledgeInput:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          minLength: 1
